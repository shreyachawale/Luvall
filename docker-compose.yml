# Production stack: MongoDB (single-node replica set, needed for transactions), the Node app,
# Caddy (automatic HTTPS) and nightly backups.
# Usage: cp .env.example .env (fill it in) && docker compose up -d --build
services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    # Not published to the host: reachable only on the private compose network.
    volumes:
      - mongodata:/data/db
      - mongoconfig:/data/configdb
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once it is PRIMARY.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().myState === 1 ? quit(0) : quit(1) } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}); quit(1) }"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/luvall?replicaSet=rs0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      COOKIE_SECURE: "true"
      ALLOWED_ORIGINS: https://${SITE_DOMAIN}
      SITE_URL: https://${SITE_DOMAIN}
      TZ_ACADEMY: ${TIMEZONE:-Asia/Kolkata}
    volumes:
      - media:/app/media

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: mongo:8.0
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - media:/media:ro
    entrypoint: ["/bin/bash", "-c", "while true; do /backup.sh || echo 'backup failed'; sleep 86400; done"]

volumes:
  mongodata:
  mongoconfig:
  media:
  caddy_data:
  caddy_config:
